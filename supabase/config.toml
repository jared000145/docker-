project_id = "rectorplus"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080/reset-password", "http://localhost:8080/login", "http://localhost:4173/reset-password", "http://127.0.0.1:4173/reset-password"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "25MiB"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.request-password-reset]
verify_jwt = false

[functions.begin-preregistration]
verify_jwt = false

[functions.submit-preregistration]
verify_jwt = false

# User endpoints verify the caller with Auth getUser(token) inside the shared handler.
# Do not rely on the gateway's legacy JWT verification with asymmetric project keys.
[functions.approve-preregistration]
verify_jwt = false
[functions.create-student]
verify_jwt = false
[functions.import-student]
verify_jwt = false
[functions.create-professor]
verify_jwt = false
[functions.create-parent]
verify_jwt = false
[functions.create-team-member]
verify_jwt = false
[functions.create-admin]
verify_jwt = false
[functions.set-institution-admin]
verify_jwt = false
[functions.update-user-password]
verify_jwt = false

[functions.send-preregistration-email]
verify_jwt = false
[functions.reject-preregistration]
verify_jwt = false
[functions.onboarding-status]
verify_jwt = false
